<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>{{ partial "head.html" . }}</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
  <div class="page">
    {{ partial "header.html" . }}
    <main>{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Dark / Light">☾</button>
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
