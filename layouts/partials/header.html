<header class="site-header">
  {{ with site.Params.banner }}
  <a class="banner banner-img" href="{{ "/" | relURL }}"><img src="{{ . | relURL }}" alt="{{ site.Params.bannerAlt | default site.Title }}"></a>
  {{ else }}
  <div class="banner banner-text">
    <a class="logo" href="{{ "/" | relURL }}">
      <span class="logo-title">{{ site.Title }}</span>
      <span class="logo-sub">{{ site.Params.tagline }}</span>
    </a>
  </div>
  {{ end }}
  <nav class="mainnav" aria-label="Main">
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    <ul class="menu">{{ partial "menu.html" (dict "entries" site.Menus.main "page" .) }}</ul>
    <form class="search" action="{{ "search/" | relURL }}" method="get" role="search">
      <input type="search" name="q" placeholder="தேடு" aria-label="தேடு">
      <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    </form>
  </nav>
</header>
